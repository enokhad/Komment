<!DOCTYPE html>
<html lang="hu"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hozzászólások</title>
<style>
:root{--card:#201c2e;--text:#eee9f7;--muted:#9a93b0;--accent:#9b7bff}
*{box-sizing:border-box}
body{margin:0;padding:4px;font-family:system-ui,sans-serif;background:#14121c;color:var(--text);line-height:1.5}
h2{margin:0 0 12px}
input,textarea{width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid #3a3452;background:var(--card);color:var(--text);font:inherit}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:1rem;cursor:pointer}
.c{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.c b{color:var(--accent)} .c small{color:var(--muted);margin-left:6px}
.c p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.note{color:var(--muted);font-size:.85rem}
</style></head><body>
<h2>Hozzászólások</h2>
<input id="nick" maxlength="24" placeholder="Becenév">
<textarea id="text" rows="3" maxlength="500" placeholder="Írd ide a véleményed…"></textarea>
<button id="send">Küldés</button>
<p class="note" id="mode">Betöltés…</p>
<div id="list"></div>
<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAn99OZXIQM5SaADMGEt-cHdnHecUi2e5c",
  authDomain: "regenyek2-komment.firebaseapp.com",
  projectId: "regenyek2-komment",
  storageBucket: "regenyek2-komment.firebasestorage.app",
  messagingSenderId: "590825336958",
  appId: "1:590825336958:web:2c63f234a35bee4147a82f"
};
const $ = s => document.getElementById(s);
const id = new URLSearchParams(location.search).get("id") || "general";
const resize = () => parent.postMessage({ type: "comments-height", h: document.documentElement.scrollHeight }, "*");
$("nick").value = localStorage.getItem("nick") || "";
function render(items) {
  const list = $("list"); list.textContent = "";
  items.sort((a, b) => b.time - a.time).forEach(c => {
    const d = document.createElement("div"); d.className = "c";
    const b = document.createElement("b"); b.textContent = c.nick;
    const s = document.createElement("small"); s.textContent = new Date(c.time).toLocaleString("hu-HU");
    const p = document.createElement("p"); p.textContent = c.text;
    d.append(b, s, p); list.append(d);
  });
  resize();
}
let save;
try {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const { initializeApp } = await import(base + "firebase-app.js");
  const fs = await import(base + "firebase-firestore.js");
  const db = fs.initializeFirestore(initializeApp(FIREBASE_CONFIG), { experimentalAutoDetectLongPolling: true });
  const q = fs.query(fs.collection(db, "comments"), fs.where("gameId", "==", id));
  fs.onSnapshot(q, snap => render(snap.docs.map(d => d.data())), err => { $("mode").textContent = "Hiba az olvasásnál: " + err.code; });
  save = c => fs.addDoc(fs.collection(db, "comments"), { ...c, gameId: id });
  $("mode").textContent = "Mindenki látja a hozzászólásokat.";
} catch (e) { $("mode").textContent = "Nem sikerült betölteni a Firebase-t: " + e.message; }
$("send").onclick = async () => {
  const nick = $("nick").value.trim(), text = $("text").value.trim();
  if (!nick || !text) return;
  if (!save) { $("mode").textContent = "A hozzászólás rendszer nem érhető el."; return; }
  localStorage.setItem("nick", nick);
  $("mode").textContent = "Küldés…";
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej({ code: "időtúllépés" }), 10000));
    await Promise.race([save({ nick, text, time: Date.now() }), timeout]);
    $("text").value = ""; $("mode").textContent = "Elmentve ✔";
  } catch (e) { $("mode").textContent = "Hiba a mentésnél: " + (e.code || e.message); }
};
resize();
</script></body></html>
